services:
  - type: web
    name: khang-3d-portfolio
    runtime: node
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
